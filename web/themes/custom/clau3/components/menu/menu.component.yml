$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Menu
status: stable
description: 'A flat list of links: horizontal on desktop, stacked 44px rows on phones. No submenus. The current page carries aria-current.'
props:
  type: object
  required:
    - items
  properties:
    label:
      type: string
      title: 'Accessible name of the navigation landmark'
      default: Main
    items:
      type: array
      title: Items
      items:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          active:
            type: boolean
