$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Footer
status: stable
description: 'Dark slate band in three layers (Solent pattern): the main menu in one ruled row (two rows of three on phones) with the social links to its right; a ruled row of policy links; the copyright line. Stacks on phones.'
props:
  type: object
  required:
    - organisation
    - year
  properties:
    organisation:
      type: string
      title: 'Organisation named in the copyright line'
    year:
      type: string
      title: Year
slots:
  menu:
    title: 'Main menu (rendered by menu--main--footer.html.twig)'
  social:
    title: 'Social and contact links'
  legal:
    title: 'Policy links (the "footer" menu, rendered by menu--footer.html.twig)'
