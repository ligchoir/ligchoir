$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Event card'
status: stable
description: 'An upcoming event as a card: image, date, title, venue. The whole card links to the event page (never to the organiser).'
props:
  type: object
  required:
    - title
    - url
  properties:
    title:
      type: string
    url:
      type: string
    venue:
      type: string
slots:
  image:
    title: 'Rendered image (responsive image, card style)'
  date:
    title: 'Rendered date'
